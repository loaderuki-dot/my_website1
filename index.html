<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Shodiyona</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #05020a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* ENVELOPE CARD */
    .envelope-wrapper {
      position: relative;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.8s ease;
    }
    .envelope-wrapper.hide {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }
    .envelope {
      width: 280px;
      height: 180px;
      background: rgba(20, 10, 30, 0.6);
      border: 2px solid rgba(255, 100, 150, 0.6);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 50, 120, 0.4), inset 0 0 15px rgba(255, 50, 120, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      backdrop-filter: blur(5px);
    }
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-top: 100px solid rgba(255, 100, 150, 0.3);
    }
    .btn-for-you {
      padding: 12px 28px;
      background: linear-gradient(45deg, #ff2a75, #ff6496);
      border: none;
      border-radius: 25px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(255, 42, 117, 0.8);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 2;
    }
    .btn-for-you:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 42, 117, 1);
    }

    /* REPLAY BUTTON */
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: 0.3s;
    }
    .icon-btn:hover {
      background: rgba(255, 42, 117, 0.4);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="controls">
    <button class="icon-btn" id="replay-btn" title="Qayta ijro">↺</button>
  </div>

  <div class="envelope-wrapper" id="envelope">
    <div class="envelope">
      <button class="btn-for-you">FOR YOU</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // SCENE SETUP
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05020a, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 40);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // STATE MANAGEMENT
    let stage = 0; // 0: Waiting, 1: Spiral Explosion + Text, 2: 3D Rose Flower
    let animationTime = 0;

    // PARTICLE TEXT (SHODIYONA)
    function createTextParticles() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 256;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'Bold 110px "Brush Script MT", cursive, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Shodiyona', canvas.width / 2, canvas.height / 2);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const points = [];

      for (let y = 0; y < canvas.height; y += 4) {
        for (let x = 0; x < canvas.width; x += 4) {
          const alpha = imgData[(y * canvas.width + x) * 4];
          if (alpha > 128) {
            const posX = (x - canvas.width / 2) * 0.055;
            const posY = -(y - canvas.height / 2) * 0.055 - 4;
            points.push(new THREE.Vector3(posX, posY, 0));
          }
        }
      }
      return points;
    }

    // SPIRAL BACKGROUND PARTICLES
    const spiralCount = 2500;
    const spiralGeo = new THREE.BufferGeometry();
    const spiralPos = new Float32Array(spiralCount * 3);
    const spiralColors = new Float32Array(spiralCount * 3);

    for (let i = 0; i < spiralCount; i++) {
      spiralPos[i * 3] = 0;
      spiralPos[i * 3 + 1] = 0;
      spiralPos[i * 3 + 2] = 0;

      const c = new THREE.Color().setHSL(0.9 + Math.random() * 0.1, 0.9, 0.6);
      spiralColors[i * 3] = c.r;
      spiralColors[i * 3 + 1] = c.g;
      spiralColors[i * 3 + 2] = c.b;
    }
    spiralGeo.setAttribute('position', new THREE.BufferAttribute(spiralPos, 3));
    spiralGeo.setAttribute('color', new THREE.BufferAttribute(spiralColors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.6,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const spiralParticles = new THREE.Points(spiralGeo, particleMat);
    scene.add(spiralParticles);

    // TEXT MESH
    const textPoints = createTextParticles();
    const textGeo = new THREE.BufferGeometry();
    const textPos = new Float32Array(textPoints.length * 3);
    textPoints.forEach((p, i) => {
      textPos[i * 3] = p.x;
      textPos[i * 3 + 1] = p.y;
      textPos[i * 3 + 2] = p.z;
    });
    textGeo.setAttribute('position', new THREE.BufferAttribute(textPos, 3));
    const textMat = new THREE.PointsMaterial({
      size: 0.45,
      color: 0xff69b4,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const textMesh = new THREE.Points(textGeo, textMat);
    scene.add(textMesh);

    // 3D MATHEMATICAL ROSE FLOWER
    const roseGroup = new THREE.Group();
    scene.add(roseGroup);

    function build3DRose() {
      // Petals
      const petalCount = 8000;
      const roseGeo = new THREE.BufferGeometry();
      const rosePos = new Float32Array(petalCount * 3);
      const roseColors = new Float32Array(petalCount * 3);

      for (let i = 0; i < petalCount; i++) {
        const u = Math.random() * Math.PI * 8;
        const v = Math.random() * Math.PI;

        // Mathematical Rose Surface Formula
        const r = (Math.sin(1.2 * u) + 1.5) * Math.sin(v) * 6;
        const x = r * Math.cos(u);
        const z = r * Math.sin(u);
        const y = (Math.cos(1.2 * u) + Math.cos(v) * 2) * 2 + 5;

        rosePos[i * 3] = x;
        rosePos[i * 3 + 1] = y;
        rosePos[i * 3 + 2] = z;

        const col = new THREE.Color();
        if (r < 3) col.setHSL(0.95, 1, 0.4); // Dark red inner core
        else col.setHSL(0.92, 0.9, 0.6);   // Pinkish outer petals

        roseColors[i * 3] = col.r;
        roseColors[i * 3 + 1] = col.g;
        roseColors[i * 3 + 2] = col.b;
      }

      roseGeo.setAttribute('position', new THREE.BufferAttribute(rosePos, 3));
      roseGeo.setAttribute('color', new THREE.BufferAttribute(roseColors, 3));

      const roseMat = new THREE.PointsMaterial({
        size: 0.4,
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
      });
      const rosePoints = new THREE.Points(roseGeo, roseMat);
      roseGroup.add(rosePoints);

      // Stem & Leaves (Yashil Poya va Yaproqlar)
      const stemCount = 2000;
      const stemGeo = new THREE.BufferGeometry();
      const stemPos = new Float32Array(stemCount * 3);
      const stemColors = new Float32Array(stemCount * 3);

      for (let i = 0; i < stemCount; i++) {
        const t = Math.random();
        const y = 3 - t * 18; // Poya balandligi
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.4;

        let x = Math.cos(angle) * radius;
        let z = Math.sin(angle) * radius;

        // Leaves branching out
        if (t > 0.4 && t < 0.6 && Math.random() > 0.5) {
          x += Math.cos(angle) * (t - 0.4) * 15;
        }

        stemPos[i * 3] = x;
        stemPos[i * 3 + 1] = y;
        stemPos[i * 3 + 2] = z;

        const c = new THREE.Color().setHSL(0.35, 0.9, 0.4); // Yashil nur
        stemColors[i * 3] = c.r;
        stemColors[i * 3 + 1] = c.g;
        stemColors[i * 3 + 2] = c.b;
      }

      stemGeo.setAttribute('position', new THREE.BufferAttribute(stemPos, 3));
      stemGeo.setAttribute('color', new THREE.BufferAttribute(stemColors, 3));

      const stemMat = new THREE.PointsMaterial({
        size: 0.35,
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending
      });
      const stemPoints = new THREE.Points(stemGeo, stemMat);
      roseGroup.add(stemPoints);

      roseGroup.position.y = -2;
    }

    build3DRose();

    // INTERACTION LOGIC
    const envelope = document.getElementById('envelope');
    const replayBtn = document.getElementById('replay-btn');

    envelope.addEventListener('click', startAnimation);
    replayBtn.addEventListener('click', resetAnimation);

    function startAnimation() {
      if (stage !== 0) return;
      stage = 1;
      animationTime = 0;
      envelope.classList.add('hide');
    }

    function resetAnimation() {
      stage = 0;
      animationTime = 0;
      envelope.classList.remove('hide');
      particleMat.opacity = 0;
      textMat.opacity = 0;
      roseGroup.children.forEach(c => c.material.opacity = 0);
      roseGroup.rotation.y = 0;
    }

    // ANIMATION LOOP
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (stage === 1) {
        animationTime += delta;

        // 1. Spiral Particle Expansion
        particleMat.opacity = Math.min(animationTime * 0.8, 0.8);
        const posArr = spiralGeo.attributes.position.array;

        for (let i = 0; i < spiralCount; i++) {
          const r = (i / spiralCount) * 22 * Math.min(animationTime * 0.8, 1);
          const theta = i * 0.1 + animationTime * 1.5;
          posArr[i * 3] = r * Math.cos(theta);
          posArr[i * 3 + 1] = r * Math.sin(theta) + Math.sin(theta * 2) * 2;
          posArr[i * 3 + 2] = Math.sin(r) * 3;
        }
        spiralGeo.attributes.position.needsUpdate = true;

        // 2. Text Fade In
        if (animationTime > 0.5) {
          textMat.opacity = Math.min((animationTime - 0.5) * 1.2, 1);
        }

        // 3. Transition to Rose
        if (animationTime > 3.8) {
          stage = 2;
          animationTime = 0;
        }
      } 
      else if (stage === 2) {
        animationTime += delta;

        // Fade out text and background spiral
        textMat.opacity = Math.max(1 - animationTime * 0.8, 0);
        particleMat.opacity = Math.max(0.8 - animationTime * 0.5, 0);

        // Fade in 3D Rose Flower
        roseGroup.children.forEach(c => {
          c.material.opacity = Math.min(animationTime * 0.6, 0.9);
        });

        // Smooth rotation
        roseGroup.rotation.y += 0.008;
        roseGroup.rotation.x = Math.sin(animationTime * 0.5) * 0.1;
      }

      renderer.render(scene, camera);
    }

    animate();

    // RESIZE HANDLER
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
