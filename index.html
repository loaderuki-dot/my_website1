<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Shodiyona</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020005;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    /* ENVELOPE CARD */
    .envelope-wrapper {
      position: relative;
      z-index: 10;
      cursor: pointer;
      transition: transform 0.5s ease, opacity 0.8s ease;
    }
    .envelope-wrapper.hide {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }
    .envelope {
      width: 260px;
      height: 170px;
      background: rgba(15, 5, 25, 0.75);
      border: 2px solid rgba(255, 80, 140, 0.7);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 50, 120, 0.5), inset 0 0 15px rgba(255, 50, 120, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      backdrop-filter: blur(8px);
    }
    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 130px solid transparent;
      border-right: 130px solid transparent;
      border-top: 95px solid rgba(255, 100, 150, 0.35);
    }
    .btn-for-you {
      padding: 12px 28px;
      background: linear-gradient(45deg, #ff2a75, #ff6496);
      border: none;
      border-radius: 25px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(255, 42, 117, 0.8);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 2;
    }
    .btn-for-you:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255, 42, 117, 1);
    }

    /* CONTROLS */
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: 0.3s;
    }
    .icon-btn:hover {
      background: rgba(255, 42, 117, 0.4);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="controls">
    <button class="icon-btn" id="replay-btn" title="Qayta boshlash">↺</button>
  </div>

  <div class="envelope-wrapper" id="envelope">
    <div class="envelope">
      <button class="btn-for-you">FOR YOU</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 38);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    let stage = 0;
    let time = 0;

    // SHODIYONA YOZUVI
    function createTextParticles() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = 256;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'Bold 110px "Brush Script MT", cursive, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Shodiyona', canvas.width / 2, canvas.height / 2);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      const points = [];

      for (let y = 0; y < canvas.height; y += 4) {
        for (let x = 0; x < canvas.width; x += 4) {
          const alpha = imgData[(y * canvas.width + x) * 4];
          if (alpha > 128) {
            const posX = (x - canvas.width / 2) * 0.045;
            const posY = -(y - canvas.height / 2) * 0.045 - 5.5;
            points.points = points.push(new THREE.Vector3(posX, posY, 0));
          }
        }
      }
      return points;
    }

    const textPoints = createTextParticles();
    const textGeo = new THREE.BufferGeometry();
    const textPos = new Float32Array(textPoints.length * 3);
    textPoints.forEach((p, i) => {
      textPos[i * 3] = p.x;
      textPos[i * 3 + 1] = p.y;
      textPos[i * 3 + 2] = p.z;
    });
    textGeo.setAttribute('position', new THREE.BufferAttribute(textPos, 3));
    const textMat = new THREE.PointsMaterial({
      size: 0.38,
      color: 0xff4d8d,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const textMesh = new THREE.Points(textGeo, textMat);
    scene.add(textMesh);

    // HAQIQIY 3D ROZA GULI (MATEMATIK HESOB)
    const roseCount = 5000;
    const roseGeo = new THREE.BufferGeometry();
    const rosePos = new Float32Array(roseCount * 3);
    const roseColors = new Float32Array(roseCount * 3);

    for (let i = 0; i < roseCount; i++) {
      rosePos[i * 3] = 0;
      rosePos[i * 3 + 1] = 0;
      rosePos[i * 3 + 2] = 0;

      const c = new THREE.Color().setHSL(0.92 + Math.random() * 0.05, 0.95, 0.55);
      roseColors[i * 3] = c.r;
      roseColors[i * 3 + 1] = c.g;
      roseColors[i * 3 + 2] = c.b;
    }
    roseGeo.setAttribute('position', new THREE.BufferAttribute(rosePos, 3));
    roseGeo.setAttribute('color', new THREE.BufferAttribute(roseColors, 3));

    const roseMat = new THREE.PointsMaterial({
      size: 0.42,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const roseMesh = new THREE.Points(roseGeo, roseMat);
    roseMesh.position.y = 2.5;
    scene.add(roseMesh);

    // YASHIL POYA
    const stemCount = 1200;
    const stemGeo = new THREE.BufferGeometry();
    const stemPos = new Float32Array(stemCount * 3);
    const stemColors = new Float32Array(stemCount * 3);

    for (let i = 0; i < stemCount; i++) {
      stemPos[i * 3] = 0;
      stemPos[i * 3 + 1] = 0;
      stemPos[i * 3 + 2] = 0;

      const c = new THREE.Color(0x00ff66);
      stemColors[i * 3] = c.r;
      stemColors[i * 3 + 1] = c.g;
      stemColors[i * 3 + 2] = c.b;
    }
    stemGeo.setAttribute('position', new THREE.BufferAttribute(stemPos, 3));
    stemGeo.setAttribute('color', new THREE.BufferAttribute(stemColors, 3));

    const stemMat = new THREE.PointsMaterial({
      size: 0.35,
      vertexColors: true,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const stemMesh = new THREE.Points(stemGeo, stemMat);
    scene.add(stemMesh);

    // BOSHQARUV
    const envelope = document.getElementById('envelope');
    const replayBtn = document.getElementById('replay-btn');

    envelope.addEventListener('click', () => {
      if (stage !== 0) return;
      stage = 1;
      time = 0;
      envelope.classList.add('hide');
    });

    replayBtn.addEventListener('click', () => {
      stage = 0;
      time = 0;
      envelope.classList.remove('hide');
      textMat.opacity = 0;
      roseMat.opacity = 0;
      stemMat.opacity = 0;
      roseMesh.rotation.y = 0;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (stage === 1) {
        time += delta;

        textMat.opacity = Math.min(time * 0.8, 1);
        roseMat.opacity = Math.min(time * 0.9, 0.95);

        // 3D ROZA FORMULASI (Haqqoniy gul hajmi va qatlamlari)
        const rArr = roseGeo.attributes.position.array;
        for (let i = 0; i < roseCount; i++) {
          const progress = Math.min(time * 0.7, 1);
          const u = (i / roseCount) * Math.PI * 10;
          const v = (i / roseCount) * Math.PI * 2;

          const r = (Math.sin(2 * u) + 1.4) * Math.cos(v) * 4.5 * progress;
          const x = r * Math.sin(u);
          const z = r * Math.cos(u);
          const y = (Math.sin(v) * 3 + Math.cos(u * 1.5) * 1.5) * progress;

          rArr[i * 3] = x;
          rArr[i * 3 + 1] = y;
          rArr[i * 3 + 2] = z;
        }
        roseGeo.attributes.position.needsUpdate = true;
        roseMesh.rotation.y += 0.005;

        // Poya
        if (time > 0.8) {
          stemMat.opacity = Math.min((time - 0.8) * 1.2, 0.95);
          const stArr = stemGeo.attributes.position.array;
          for (let i = 0; i < stemCount; i++) {
            const t = (i / stemCount);
            const stemProgress = Math.min((time - 0.8) * 1.5, 1);
            
            stArr[i * 3] = Math.sin(t * Math.PI * 2) * 0.2;
            stArr[i * 3 + 1] = 2.5 - (t * 8 * stemProgress);
            stArr[i * 3 + 2] = Math.cos(t * Math.PI * 2) * 0.2;
          }
          stemGeo.attributes.position.needsUpdate = true;
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
